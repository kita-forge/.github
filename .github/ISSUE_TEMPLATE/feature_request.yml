name: 機能提案
description: 新機能や既存機能の改善を提案します
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 誰が、どのような場面で困っているかを記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 期待する機能や動作を記載してください。
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: 期待する効果
      description: 実現すると何が改善されるかを記載してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 他に考えた方法や回避策があれば記載してください。
  - type: textarea
    id: references
    attributes:
      label: 参考情報
      description: 関連 Issue、資料、画面例などがあれば記載してください。
